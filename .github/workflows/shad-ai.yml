name: Shad AI Assistant

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: shad-ai-polling
  cancel-in-progress: false

jobs:
  shad-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore Shad session and deduplication state
        uses: actions/cache@v4
        with:
          path: |
            sessions/
            .shad_state/
          key: shad-ai-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            shad-ai-${{ runner.os }}-

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Restore initial session if cache is empty
        env:
          SHAD_SESSION_FILENAME: ${{ secrets.SHAD_SESSION_FILENAME }}
          SHAD_SESSION_B64: ${{ secrets.SHAD_SESSION_B64 }}
        run: python session_bootstrap.py

      - name: Run Shad assistant for this scheduled window
        env:
          SHAD_PHONE: ${{ secrets.SHAD_PHONE }}
          SHAD_SESSION_KEY: ${{ secrets.SHAD_SESSION_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          ENABLE_GROUPS: "false"
          BOT_RUN_SECONDS: "210"
        run: python github_runner.py
